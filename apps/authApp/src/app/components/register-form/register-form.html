<section>
  <p class="font-edwardian text-5xl text-center mb-4 text-maroon-700 dark:text-soft-pink-300">
    {{ 'AUTH.REGISTER.FAMILY_TITLE' | translate }}
  </p>
  <hr class="text-zinc-200 mb-6 dark:text-zinc-600">

  @if (step() === 1) {
    <app-register-email-step (completed)="onEmailCompleted($event)" />
  }

  @if (step() === 2) {
    <app-register-otp-step
      [email]="verificationEmail()"
      [length]="length"
      [cooldownTime]="cooldownTime"
      [expirationTime]="expirationTime"
      (completed)="onOtpCompleted()"
    />
  }

  @if (step() === 3) {
    <app-register-details-step [verificationEmail]="verificationEmail()" />
  }
</section>
