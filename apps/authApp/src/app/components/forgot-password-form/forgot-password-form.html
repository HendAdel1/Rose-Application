<form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
  <p class="font-inter font-semibold text-2xl text-zinc-800 dark:text-zinc-50">Forgot Password?</p>
  <p class="font-inter text-base text-zinc-800 mb-4 dark:text-zinc-50">
    Worry not, we'll send you instructions to help you reset it.
  </p>
  <hr class="text-zinc-200 mb-6 dark:text-zinc-600">

  <div class="mb-4">
    <lib-ui-label forId="email">Email</lib-ui-label>
    <lib-custom-input
      formControlName="email"
      type="email"
      placeholder="user@example.com"
      [isInvalid]="!!emailError()"
      [errorMessage]="emailError()"
    />
  </div>

  @if (isSuccess()) {
    <p
      class="mb-4 rounded-[10px] bg-emerald-300 px-4 py-3 font-inter text-sm text-zinc-800"
      role="status"
    >
      {{ successMessage() }}
    </p>
  }

  <lib-ui-error-message [hide]="isError()">
    {{ errorMessage() }}
  </lib-ui-error-message>

  <lib-ui-button type="submit" [loading]="isLoading()">
    Continue
  </lib-ui-button>
</form>
