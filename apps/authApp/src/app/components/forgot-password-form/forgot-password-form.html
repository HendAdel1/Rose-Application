<form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <p class="font-inter font-semibold text-2xl text-zinc-800">Forgot Password?</p>
    <p class="font-inter text-base text-zinc-800 mb-4">Worry not, we'll send you instructions to help you reset it.</p>
    <hr class="text-zinc-200 mb-6">

    <div class="mb-4">
        <label for="email" class="block font-inter text-sm font-medium text-zinc-800 mb-1.5">
            Email
        </label>

        <input type="email" placeholder="user@example.com" formControlName="email"
            class="w-full font-inter rounded-[10px] border border-zinc-300 p-4 focus:outline-none hover:border-zinc-400 focus:border-maroon-600 placeholder:text-zinc-400" />
    </div>
  

  <!-- Button -->
  <app-auth-button [loading]="isSubmitting">
    Continue
  </app-auth-button>


</form>
