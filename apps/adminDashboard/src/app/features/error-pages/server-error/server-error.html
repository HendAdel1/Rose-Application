<section class="flex flex-col items-center justify-center min-h-[calc(100vh-14rem)] px-4 py-10 text-center select-none" aria-labelledby="server-error-title">
  <div class="w-full max-w-md flex flex-col items-center">
    <!-- Minimalist Outline Illustration -->
    <div class="relative mb-6 flex items-center justify-center">
      <svg viewBox="0 0 200 200" class="w-40 h-40 md:w-48 md:h-48 text-zinc-300 dark:text-zinc-600" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Floating Sparkles & Dots -->
        <path d="M45 40v6M42 43h6" stroke-width="1.5" />
        <circle cx="35" cy="85" r="2.5" stroke-width="1.5" />
        <path d="M160 35v8M156 39h8" stroke-width="1.5" />
        <circle cx="170" cy="75" r="2.5" stroke-width="1.5" />
        <path d="M40 145v6M37 148h6" stroke-width="1.5" />
        <circle cx="50" cy="170" r="2" stroke-width="1.5" />
        <circle cx="155" cy="150" r="2.5" stroke-width="1.5" />
        <path d="M165 130v6M162 133h6" stroke-width="1.5" />

        <!-- Cloud / Server Outline -->
        <path d="M60 115 A25 25 0 0 1 85 75 A35 35 0 0 1 145 80 A25 25 0 0 1 140 125 L65 125 A15 15 0 0 1 60 115 Z" stroke-width="2.5" />

        <!-- Sad Face Expression -->
        <circle cx="88" cy="98" r="2.5" fill="currentColor" />
        <circle cx="118" cy="98" r="2.5" fill="currentColor" />
        <path d="M92 115 C98 110, 108 110, 114 115" stroke-width="2" />

        <!-- Sub-badge with Warning Alert -->
        <circle cx="132" cy="130" r="17" class="fill-white dark:fill-zinc-900" stroke-width="2" />
        <line x1="132" y1="123" x2="132" y2="130" stroke-width="2" />
        <circle cx="132" cy="134" r="1" fill="currentColor" />
      </svg>
    </div>

    <!-- Title -->
    <h1 id="server-error-title" class="text-xl md:text-2xl font-medium text-zinc-700 dark:text-zinc-200 mb-2">
      {{ 'ERROR_PAGES.SERVER_ERROR.TITLE' | translate }}
    </h1>

    <!-- Description / Reason -->
    <p class="text-sm text-zinc-400 dark:text-zinc-500 max-w-sm mx-auto mb-6 leading-relaxed">
      {{ 'ERROR_PAGES.SERVER_ERROR.DESCRIPTION' | translate }}
    </p>

    <!-- Action Buttons -->
    <div class="flex items-center justify-center gap-3">
      <button
        type="button"
        (click)="reload()"
        class="inline-flex items-center justify-center px-6 py-2.5 rounded-xl bg-[#8A1730] hover:bg-[#741328] active:scale-[0.98] text-white text-sm font-medium shadow-sm hover:shadow transition-all duration-200 cursor-pointer"
      >
        <span>{{ 'ERROR_PAGES.TRY_AGAIN' | translate }}</span>
      </button>

      <a
        [routerLink]="dashboardUrl"
        class="inline-flex items-center justify-center px-6 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-300 text-sm font-medium transition-all duration-200 cursor-pointer"
      >
        <span>{{ 'ERROR_PAGES.BACK_TO_DASHBOARD' | translate }}</span>
      </a>
    </div>
  </div>
</section>
