<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-zinc-900 dark:text-zinc-100">
        {{ 'DASHBOARD.PRODUCTS' | translate }}
      </h1>
      <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">
        Manage your product catalog, inventory, and pricing.
      </p>
    </div>

    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#8A1730] hover:bg-[#741328] text-white text-xs font-semibold shadow-sm transition-colors cursor-pointer"
    >
      <svg lucidePlus [size]="16" aria-hidden="true"></svg>
      <span>{{ 'DASHBOARD.ADD_PRODUCT' | translate }}</span>
    </button>
  </div>

  <div class="rounded-2xl border border-zinc-200/80 dark:border-zinc-800 bg-white dark:bg-zinc-900 overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-zinc-600 dark:text-zinc-400">
        <thead class="bg-zinc-50 dark:bg-zinc-800/50 text-xs uppercase font-semibold text-zinc-700 dark:text-zinc-300 border-b border-zinc-200/80 dark:border-zinc-800">
          <tr>
            <th class="px-6 py-3.5">Product Name</th>
            <th class="px-6 py-3.5">Category</th>
            <th class="px-6 py-3.5">Price</th>
            <th class="px-6 py-3.5">Stock</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-zinc-100 dark:divide-zinc-800">
          @for (prod of products; track prod.id) {
            <tr class="hover:bg-zinc-50/60 dark:hover:bg-zinc-800/40 transition-colors">
              <td class="px-6 py-4 font-semibold text-zinc-900 dark:text-zinc-100 flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-zinc-500 shrink-0">
                  <svg lucidePackage [size]="18" aria-hidden="true"></svg>
                </div>
                <span>{{ prod.name }}</span>
              </td>
              <td class="px-6 py-4">
                {{ prod.category }}
              </td>
              <td class="px-6 py-4 font-medium text-zinc-900 dark:text-zinc-100">
                {{ prod.price }}
              </td>
              <td class="px-6 py-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">
                  {{ prod.stock }} in stock
                </span>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
