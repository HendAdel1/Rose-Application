@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs animate-in fade-in duration-200"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'DASHBOARDOCCASIONS.DELETE_TITLE' | translate"
  >
    <div
      class="w-full max-w-md bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 rounded-2xl shadow-2xl p-6 text-center transform transition-all animate-in zoom-in-95 duration-150"
    >
      <!-- Icon Container -->
      <div
        class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 flex items-center justify-center mx-auto mb-4"
      >
        <svg lucideTrash2 [size]="24" aria-hidden="true"></svg>
      </div>

      <!-- Title -->
      <h3 class="text-lg font-bold text-zinc-900 dark:text-zinc-100 mb-2">
        {{ 'DASHBOARDOCCASIONS.DELETE_TITLE' | translate }}
      </h3>

      <!-- Message -->
      <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-6">
        {{ 'DASHBOARDOCCASIONS.DELETE_CONFIRMATION' | translate }}
        @if (occasionTitle()) {
          <span class="font-semibold text-zinc-900 dark:text-zinc-200">
            "{{ occasionTitle() }}"
          </span>
        }
        ?
      </p>

      <!-- Action Buttons -->
      <div class="flex items-center justify-center gap-3">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isDeleting()"
          class="flex-1 px-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-700 transition-colors cursor-pointer disabled:opacity-50"
        >
          {{ 'DASHBOARDOCCASIONS.CANCEL' | translate }}
        </button>

        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isDeleting()"
          class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-semibold shadow-sm transition-colors cursor-pointer disabled:opacity-50"
        >
          @if (isDeleting()) {
            <svg lucideLoader2 [size]="16" class="animate-spin" aria-hidden="true"></svg>
            <span>{{ 'DASHBOARDOCCASIONS.DELETING' | translate }}</span>
          } @else {
            <span>{{ 'DASHBOARDOCCASIONS.CONFIRM_DELETE' | translate }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
