<div class="bg-white p-6 rounded-2xl border border-gray-100 flex flex-col justify-between h-full">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Orders Status</h2>

      @if (orderStatusData(); as status) {
        <div class="relative flex items-center justify-center min-h-[220px]">
          <p-chart type="doughnut" [data]="chartData" [options]="chartOptions" class="w-52 h-52" />
        </div>

        <!-- Custom Legend Details -->
        <div class="mt-4 space-y-2">
          <div class="flex items-center justify-between text-xs text-gray-600">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#10B981]"></span>
              <span>Completed</span>
            </div>
            <span class="font-semibold">{{ status.completed.count }} ({{ status.completed.percent }}%)</span>
          </div>

          <div class="flex items-center justify-between text-xs text-gray-600">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#3B82F6]"></span>
              <span>In progress</span>
            </div>
            <span class="font-semibold">{{ status.inProgress.count }} ({{ status.inProgress.percent }}%)</span>
          </div>

          <div class="flex items-center justify-between text-xs text-gray-600">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#EF4444]"></span>
              <span>Canceled</span>
            </div>
            <span class="font-semibold">{{ status.canceled.count }} ({{ status.canceled.percent }}%)</span>
          </div>
        </div>
      }
    </div>
