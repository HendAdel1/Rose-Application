<section class="min-h-[200px]">
  <div class="max-w-4xl mx-auto p-6 bg-white dark:bg-zinc-900 rounded-xl shadow-sm">
    <h1 class="text-xl font-semibold text-gray-800 dark:text-zinc-100 mb-6">
      {{ (currentView() === 'settings' ? 'ACCOUNT_SETTINGS.TITLE' : 'ACCOUNT_SETTINGS.CHANGE_PASSWORD') | translate }}
    </h1>

    @if (currentView() === 'settings') {
      <lib-dynamic-form
        [config]="accountConfig"
        [initialValue]="initialValues()"
        (formSubmit)="onSaveAccount($event)"
      >
        <div slot="before-actions" class="flex items-center justify-between pt-6 mt-6 border-t border-gray-100 dark:border-zinc-800">
          <div class="flex items-center gap-4 text-xs font-medium">
            <button
              type="button"
              class="text-rose-600 hover:text-rose-700 dark:text-rose-400"
              (click)="openDeleteDialog()"
            >
              {{ 'ACCOUNT_SETTINGS.DELETE_ACCOUNT' | translate }}
            </button>
            <button
              type="button"
              class="text-gray-600 hover:text-gray-800 dark:text-zinc-400 dark:hover:text-zinc-200"
              (click)="currentView.set('password')"
            >
              {{ 'ACCOUNT_SETTINGS.CHANGE_PASSWORD' | translate }}
            </button>
          </div>
        </div>
      </lib-dynamic-form>
    } @else {
      <lib-dynamic-form
        [config]="passwordConfig"
        (formSubmit)="onSavePassword($event)"
        (formCancel)="currentView.set('settings')"
      />
    }
  </div>

  <lib-confirm-dialog
    [open]="isDeleteDialogOpen()"
    [message]="'ACCOUNT_SETTINGS.DELETE_CONFIRM_MSG' | translate"
    [confirmLabel]="'ACCOUNT_SETTINGS.DELETE_CONFIRM_BTN' | translate"
    [cancelLabel]="'COMMON-DIALOG.CANCEL' | translate"
    [loading]="isDeleting()"
    (confirmed)="deleteAccount()"
    (cancelled)="closeDeleteDialog()"
  />
</section>
