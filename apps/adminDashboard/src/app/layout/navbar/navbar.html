<header
  class="admin-navbar w-full bg-white dark:bg-zinc-900 border-b border-zinc-100 dark:border-zinc-800/80 transition-colors duration-200 select-none z-20"
  aria-label="Dashboard Header"
>
  <div class="flex items-center justify-between h-14 sm:h-16 px-4 sm:px-6">
    <!-- Left Section: Mobile Brand / Desktop Breadcrumb -->
    <div class="flex items-center gap-3">
      <!-- Mobile View Brand: Logo + Dynamic Section Name (Matching Screenshot 2) -->
      <div class="flex items-center gap-2.5 lg:hidden">
        <img
          [src]="logoPath"
          alt="Rose"
          class="h-8 w-auto object-contain"
        />
        <span class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">
          {{ (currentSectionKey() || 'DASHBOARD.TITLE') | translate }}
        </span>
      </div>

      <!-- Desktop View: Breadcrumb with Dynamic Section Name (Matching Screenshot 2) -->
      <div class="hidden lg:flex items-center gap-2 text-sm">
        <span class="font-normal text-zinc-400 dark:text-zinc-400">
          {{ 'DASHBOARD.TITLE' | translate }}
        </span>
        @if (currentSectionKey()) {
          <span class="text-zinc-300 dark:text-zinc-600">/</span>
          <span class="font-medium text-zinc-700 dark:text-zinc-200">
            {{ currentSectionKey()! | translate }}
          </span>
        }
      </div>
    </div>

    <!-- Right Section (Mobile Only Avatar & Profile Dropdown) -->
    <div class="lg:hidden flex items-center">
      <div class="relative">
        <button
          type="button"
          (click)="toggleProfileMenu($event)"
          class="flex items-center p-0.5 rounded-full hover:ring-2 hover:ring-zinc-300 dark:hover:ring-zinc-700 transition-all cursor-pointer"
          [attr.aria-expanded]="profileMenuOpen()"
          aria-haspopup="menu"
          aria-label="User profile menu"
        >
          @if (userPhoto()) {
            <img
              [src]="userPhoto()"
              [alt]="userDisplayName()"
              class="w-8 h-8 rounded-full object-cover ring-1 ring-zinc-200 dark:ring-zinc-700 shadow-sm"
            />
          } @else {
            <div
              class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shadow-sm ring-1 ring-black/5 dark:ring-white/10"
              [style.background-color]="avatarColors().bg"
              [style.color]="avatarColors().text"
            >
              {{ avatarInitial() }}
            </div>
          }
        </button>

        <!-- Mobile Profile Dropdown (Matching Screenshot 2) -->
        @if (profileMenuOpen()) {
          <div
            class="absolute end-0 top-[calc(100%+0.6rem)] w-44 bg-white dark:bg-zinc-800 rounded-2xl shadow-2xl border border-zinc-100 dark:border-zinc-700/80 p-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150"
            role="menu"
          >
            <!-- Top Handle Indicator -->
            <div class="w-8 h-1 bg-zinc-200 dark:bg-zinc-600 rounded-full mx-auto mb-2"></div>

            <!-- Profile Item -->
            <a
              routerLink="/roseApp/settings"
              (click)="closeProfileMenu()"
              class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-50 dark:hover:bg-zinc-700/60 transition-colors cursor-pointer"
              role="menuitem"
            >
              <svg lucideUser [size]="16" class="text-zinc-500 dark:text-zinc-400" aria-hidden="true"></svg>
              <span>{{ 'DASHBOARD.PROFILE' | translate }}</span>
            </a>

            <!-- Logout Item -->
            <button
              type="button"
              (click)="logout()"
              class="flex items-center gap-2.5 w-full text-start px-3 py-2.5 rounded-xl text-xs font-medium text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors cursor-pointer"
              role="menuitem"
            >
              <svg lucideLogOut [size]="16" aria-hidden="true"></svg>
              <span>{{ 'DASHBOARD.LOGOUT' | translate }}</span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
