<nav
  class="admin-bottom-nav fixed bottom-0 inset-x-0 bg-white dark:bg-zinc-900 border-t border-zinc-200/80 dark:border-zinc-800 lg:hidden z-40 select-none shadow-[0_-2px_12px_rgba(0,0,0,0.06)] pb-[env(safe-area-inset-bottom)]"
  aria-label="Mobile Navigation"
>
  <div class="flex items-center justify-between h-16 px-3 relative max-w-md mx-auto">
    <!-- 1. Overview -->
    <a
      [routerLink]="['/adminDashboard/overview']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-tab flex flex-col items-center justify-center gap-1 py-1.5 px-3 rounded-xl transition-all duration-150 text-zinc-500 dark:text-zinc-400"
    >
      <svg lucideLayoutGrid [size]="18" aria-hidden="true"></svg>
      <span class="text-[11px] font-medium leading-none">{{ 'DASHBOARD.OVERVIEW' | translate }}</span>
    </a>

    <!-- 2. Categories -->
    <a
      [routerLink]="['/adminDashboard/categories']"
      routerLinkActive="active"
      class="nav-tab flex flex-col items-center justify-center gap-1 py-1.5 px-3 rounded-xl transition-all duration-150 text-zinc-500 dark:text-zinc-400"
    >
      <svg lucideClipboardList [size]="18" aria-hidden="true"></svg>
      <span class="text-[11px] font-medium leading-none">{{ 'DASHBOARD.CATEGORIES' | translate }}</span>
    </a>

    <!-- 3. Center Floating Action: Preview Website -->
    <div class="relative -top-4 flex flex-col items-center shrink-0">
      <a
        routerLink="/roseApp"
        class="floating-flower-btn flex items-center justify-center w-12 h-12 rounded-full bg-[#8A1730] hover:bg-[#741328] active:scale-90 text-white shadow-xl ring-4 ring-white dark:ring-zinc-900 transition-all duration-200 cursor-pointer"
        [attr.aria-label]="'DASHBOARD.PREVIEW_WEBSITE' | translate"
      >
        <svg
          class="w-5 h-5 stroke-current"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V12m4.5 0a4.5 4.5 0 1 1-4.5 4.5M16.5 12H12m-4.5 0a4.5 4.5 0 1 0 4.5 4.5M7.5 12H12m0 4.5V12"/>
        </svg>
      </a>
    </div>

    <!-- 4. Occasions -->
    <a
      [routerLink]="['/adminDashboard/occasions']"
      routerLinkActive="active"
      class="nav-tab flex flex-col items-center justify-center gap-1 py-1.5 px-3 rounded-xl transition-all duration-150 text-zinc-500 dark:text-zinc-400"
    >
      <svg lucideCalendarHeart [size]="18" aria-hidden="true"></svg>
      <span class="text-[11px] font-medium leading-none">{{ 'DASHBOARD.OCCASIONS' | translate }}</span>
    </a>

    <!-- 5. Products -->
    <a
      [routerLink]="['/adminDashboard/products']"
      routerLinkActive="active"
      class="nav-tab flex flex-col items-center justify-center gap-1 py-1.5 px-3 rounded-xl transition-all duration-150 text-zinc-500 dark:text-zinc-400"
    >
      <svg lucidePackage [size]="18" aria-hidden="true"></svg>
      <span class="text-[11px] font-medium leading-none">{{ 'DASHBOARD.PRODUCTS' | translate }}</span>
    </a>
  </div>
</nav>
