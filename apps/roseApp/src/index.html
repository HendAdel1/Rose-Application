<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>roseApp</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved/system theme before Angular boots to avoid a flash (FOUC).
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)rose\.theme=([^;]*)/);
          var saved = match ? decodeURIComponent(match[1]) : null;
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <app-rose-app-entry></app-rose-app-entry>
    <script src="https://js.stripe.com/v3/"></script>
  </body>
</html>
