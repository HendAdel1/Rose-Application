<div [class]="containerClass()">
  <span
    class="mb-3 text-sm font-bold uppercase tracking-[0.25em] text-soft-pink-500 dark:text-maroon-400"
  >
    {{ eyebrow() }}
  </span>

  <h2
    [id]="headingId()"
    class="relative z-10 text-3xl font-bold leading-tight text-maroon-700 md:text-4xl dark:text-soft-pink-200"
  >
    <span class="relative inline-block px-1">
      <span
        class="absolute inset-x-1 bottom-0 -z-10 h-[41%] w-[75%] rounded-e-lg bg-soft-pink-100 dark:bg-zinc-700"
        aria-hidden="true"
      ></span>

      <span
        class="absolute bottom-0 left-1 h-0.75 w-[30%] bg-soft-pink-600 dark:bg-soft-pink-500"
        aria-hidden="true"
      ></span>

      {{ title() }}
    </span>
  </h2>
</div>
