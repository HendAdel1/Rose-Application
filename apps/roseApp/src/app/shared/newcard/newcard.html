<div class="w-full relative flex flex-col rounded-2xl overflow-hidden  p-2 transition-all duration-300">

  <div class="relative aspect-4/3 w-full rounded-xl overflow-hidden bg-[#F9F9F9] group">

    <img [src]="config?.image" alt="card image"
         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
         [ngClass]="{'opacity-60': config?.isDimmed}">

    @if (config?.badgeText && !config?.isOverlay) {
      <div class="absolute top-2.5 right-2.5 z-10 pointer-events-none">
        <span [ngClass]="{
          'bg-[#EFEFEF] text-zinc-700': config?.badgeType === 'default' || !config?.badgeType,
          'bg-[#C97C7C] text-white': config?.badgeType === 'danger',
          'bg-amber-100 text-amber-700': config?.badgeType === 'warning'
        }" class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">
          {{ config?.badgeText }}
        </span>
      </div>
    }

    <div class="absolute inset-0 bg-[#5C1D1D]/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-3 z-20">
      <slot><ng-content select="[card-hover-actions]"></ng-content></slot>
    </div>

    <ng-content select="[card-overlay-details]"></ng-content>

  </div>

  <div class="flex flex-col gap-1 px-1 relative mt-2">
    <ng-content select="[card-details]"></ng-content>
  </div>

</div>
