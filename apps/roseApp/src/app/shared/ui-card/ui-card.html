<div class="relative flex flex-col justify-between overflow-hidden transition-all duration-300">
  <div class="group relative overflow-hidden rounded-2xl bg-gray-50" [ngClass]="imageAspect()">
    <ng-content select="[cardMedia]"></ng-content>

    <div class="absolute top-3 right-3 z-10">
      <ng-content select="[cardBadge]"></ng-content>
    </div>

    <div
      class="absolute inset-0 z-20 flex items-center justify-center bg-[#E6507380] p-4 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
    >
      <ng-content select="[cardHoverContent]"></ng-content>
    </div>
  </div>

  <div class="flex items-center justify-between gap-2 pb-2 pt-4">
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <ng-content select="[cardBody]"></ng-content>
    </div>

    <div class="shrink-0">
      <ng-content select="[cardActionMain]"></ng-content>
    </div>
  </div>
</div>
