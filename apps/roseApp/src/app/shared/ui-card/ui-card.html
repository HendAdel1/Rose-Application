<div class="group relative flex flex-col justify-between overflow-hidden transition-all duration-300">
<div class="relative overflow-hidden rounded-2xl bg-gray-50" [ngClass]="imageAspect()">
<ng-content select="[cardMedia]"></ng-content>
</div>
<div class="absolute top-3 right-3 z-10">
<ng-content select="[cardBadge]"></ng-content>
</div>
<div class="absolute inset-0 bg-[#E6507380] backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center p-4 z-20">
<ng-content select="[cardHoverContent]"></ng-content>
</div>
<div class="pt-4 pb-2 flex items-center justify-between gap-2">
<div class="flex-1 min-w-0 flex flex-col gap-1">
<ng-content select="[cardBody]"></ng-content>
</div>
<div class="shrink-0">
<ng-content select="[cardActionMain]"></ng-content>
</div>
</div>
</div>
