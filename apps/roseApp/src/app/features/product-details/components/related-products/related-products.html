<section class="related-products-section font-sarabun" aria-labelledby="related-products-title">
  <div class="mx-auto w-full">
    <header class="p-6 text-center" id="related-products-title">
      <app-custom-heading
        [title]="'PRODUCT_DETAILS.RELATED_PRODUCTS' | translate"
        align="start"
      />
    </header>

    <div class="relative">
      <button
        type="button"
        class="nav-button nav-button--floating nav-button--left"
        aria-label="Previous related products"
        (click)="scrollProducts('previous')"
      >
        <svg lucideChevronLeft [size]="18" aria-hidden="true"></svg>
      </button>

      <div #productsTrack class="products-track">
        @if (loading()) {
          @for (item of [1, 2, 3, 4]; track item) {
            <div class="related-products__item">
              <div class="h-[30rem] animate-pulse rounded-[1.75rem] bg-soft-pink-50 dark:bg-zinc-700"></div>
            </div>
          }
        } @else {
          @if (products().length) {
            @for (product of products(); track trackProduct($index, product)) {
              <app-ui-card
                class="related-products__item"
                [product]="product"
                (wishlistClick)="addToWishlist(product)"
                (viewClick)="viewProduct(product)"
                (cartClick)="quickAddToCart(product)"
              />
            }
          } @else {
            <p class="py-8 text-center text-sm font-semibold text-zinc-500 dark:text-zinc-300">
              {{ 'PRODUCT_DETAILS.NO_RELATED_PRODUCTS' | translate }}
            </p>
          }
        }
      </div>

      <button
        type="button"
        class="nav-button nav-button--floating nav-button--right"
        aria-label="Next related products"
        (click)="scrollProducts('next')"
      >
        <svg lucideChevronRight [size]="18" aria-hidden="true"></svg>
      </button>
    </div>
  </div>
</section>
