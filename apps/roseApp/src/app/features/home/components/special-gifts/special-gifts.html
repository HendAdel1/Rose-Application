<section class="special-gifts-section">
  <div class="special-gifts-layout">
    <div class="special-gifts-featured">
      <img
        src="special-gifts/gifts.png"
        [alt]="'HOME.SPECIAL_GIFTS.FEATURED_IMAGE_ALT' | translate"
        class="special-gifts-featured__image"
      >
      <div class="special-gifts-featured__overlay"></div>

      <div class="special-gifts-featured__content">
        <span class="special-gifts-featured__badge">
          {{ 'HOME.SPECIAL_GIFTS.STARTING_FROM' | translate }}
        </span>
        <h2 class="special-gifts-featured__title">
          {{ 'HOME.SPECIAL_GIFTS.TITLE' | translate }}
        </h2>
        <button class="special-gifts-featured__button" type="button" [routerLink]="['products']"  >
          {{ 'HOME.SPECIAL_GIFTS.SHOP_NOW' | translate }}
          <span><svg lucideArrowRight [size]="16" aria-hidden="true"></svg></span>
        </button>
      </div>
    </div>

    <div
      class="special-gifts-carousel"
      role="region"
      aria-roledescription="carousel"
      aria-label="Special gifts carousel"
    >
      <img
        [src]="activeBanner().image"
        [alt]="activeBanner().title | translate"
        class="special-gifts-carousel__image"
      >

      <div class="special-gifts-carousel__overlay"></div>

      <div class="special-gifts-carousel__content">
        <h1 class="special-gifts-carousel__title">
          {{ activeBanner().title | translate }}
        </h1>
        <p class="special-gifts-carousel__subtitle">
          {{ activeBanner().subtitle | translate }}
        </p>
        <button class="special-gifts-carousel__cta" type="button">
          {{ activeBanner().buttonText | translate }}
        </button>
      </div>

      <div class="special-gifts-carousel__dots" aria-label="Carousel slides">
        @for (banner of banners; track banner.title; let index = $index) {
          <button
            type="button"
            class="special-gifts-carousel__dot"
            [class.active]="activeBannerIndex() === index"
            [attr.aria-label]="'Go to slide ' + (index + 1)"
            [attr.aria-current]="activeBannerIndex() === index ? 'true' : null"
            (click)="selectBanner(index)"
          ></button>
        }
      </div>

      <div class="special-gifts-carousel__nav" aria-label="Carousel navigation">
        <button
          type="button"
          class="special-gifts-carousel__nav-button special-gifts-carousel__nav-button--previous"
          aria-label="Previous slide"
          (click)="showPreviousBanner()"
        >
          <svg lucideChevronLeft [size]="24" aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          class="special-gifts-carousel__nav-button special-gifts-carousel__nav-button--next"
          aria-label="Next slide"
          (click)="showNextBanner()"
        >
          <svg lucideChevronRight [size]="24" aria-hidden="true"></svg>
        </button>
      </div>
    </div>
  </div>
</section>
