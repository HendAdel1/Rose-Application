<section class="w-full">
  <div
    class="grid w-full grid-cols-[226px_minmax(0,1fr)] gap-6.25 max-md:grid-cols-1"
  >
    <div
      class="relative h-82.5 not-visited:overflow-hidden rounded-xl bg-[#5c1d1d] text-white max-md:h-75"
    >
      <img
        src="special-gifts/gifts.png"
        [alt]="'HOME.SPECIAL_GIFTS.FEATURED_IMAGE_ALT' | translate"
        class="pointer-events-none absolute inset-0 z-0 block h-full w-full object-cover object-center"
      />
      <div
        class="absolute inset-0 z-1 bg-linear-to-t from-[rgb(38,6,6,0.78)] from-0% via-[rgb(38,6,6,0.18)] via-58% to-transparent"
      ></div>

      <div class="absolute inset-x-4 bottom-4.5 z-2">
        <span
          class="inline-flex h-4.5 items-center rounded-full bg-maroon-50 px-2 text-[10px] font-semibold leading-none text-maroon-600"
        >
          {{ 'HOME.SPECIAL_GIFTS.STARTING_FROM' | translate }}
        </span>
        <h2
          class="mt-2 max-w-46.25 text-lg font-bold leading-[1.05] text-white"
        >
          {{ 'HOME.SPECIAL_GIFTS.TITLE' | translate }}
        </h2>
        <button
          class="mt-6.5 inline-flex h-7.5 min-w-27.25 items-center justify-center gap-2 rounded-md border-0 bg-maroon-50 px-3 text-[13px] font-medium text-maroon-700 transition hover:bg-maroon-100"
          type="button"
          [routerLink]="['products']"
        >
          {{ 'HOME.SPECIAL_GIFTS.SHOP_NOW' | translate }}
          <span
            ><svg
              lucideArrowRight
              [size]="16"
              class="rtl:rotate-180"
              aria-hidden="true"
            ></svg
          ></span>
        </button>
      </div>
    </div>

    <div
      class="relative h-82.5 overflow-hidden rounded-2xl bg-[#5c1d1d] text-white max-md:h-75"
      role="region"
      aria-roledescription="carousel"
      aria-label="Special gifts carousel"
    >
      <img
        [src]="activeBanner().image"
        [alt]="activeBanner().title | translate"
        class="pointer-events-none absolute inset-0 z-0 block h-full w-full object-cover object-center"
      />

      <div
        class="pointer-events-none absolute inset-0 z-1 bg-linear-to-r from-black/58 to-black/20"
      ></div>

      <div
        class="absolute bottom-9 left-7 z-2 max-w-97.5 text-white max-md:inset-x-5 max-md:bottom-7 rtl:left-auto rtl:right-7"
      >
        <h1
          class="text-[28px] font-bold leading-[1.1] text-white max-md:text-2xl"
        >
          {{ activeBanner().title | translate }}
        </h1>
        <p class="mt-1 text-sm leading-tight text-white/95">
          {{ activeBanner().subtitle | translate }}
        </p>
        <button
          class="mt-6.5 inline-flex h-8.25 min-w-26 items-center justify-center rounded-md border-0 bg-maroon-50 px-4.5 text-[13px] font-medium text-maroon-700 transition hover:bg-maroon-100"
          type="button"
        >
          {{ activeBanner().buttonText | translate }}
        </button>
      </div>

      <div
        class="absolute right-5.5 top-5 z-3 flex items-center gap-2 rtl:left-5.5 rtl:right-auto"
        aria-label="Carousel slides"
      >
        @for (banner of banners; track $index; let index = $index) {
        <button
          type="button"
          class="special-gifts-carousel__dot"
          [class.active]="activeBannerIndex() === index"
          [attr.aria-label]="'Go to slide ' + (index + 1)"
          [attr.aria-current]="activeBannerIndex() === index ? 'true' : null"
          (click)="selectBanner(index)"
        ></button>
        }
      </div>

      <div
        class="absolute bottom-7 right-6.5 z-3 inline-flex items-center overflow-hidden rounded-full bg-maroon-50 max-md:hidden rtl:left-6.5 rtl:right-auto"
        aria-label="Carousel navigation"
      >
        <button
          type="button"
          class="inline-flex h-8.5 w-10.5 items-center justify-center border-0 bg-transparent p-0 text-maroon-600 transition hover:bg-maroon-100 hover:text-maroon-800"
          aria-label="Previous slide"
          (click)="showPreviousBanner()"
        >
          <svg
            lucideChevronLeft
            [size]="24"
            class="block rtl:hidden"
            aria-hidden="true"
          ></svg>
          <svg
            lucideChevronRight
            [size]="24"
            class="hidden rtl:block"
            aria-hidden="true"
          ></svg>
        </button>
        <button
          type="button"
          class="inline-flex h-8.5 w-10.5 items-center justify-center border-0 bg-transparent p-0 text-maroon-600 transition hover:bg-maroon-100 hover:text-maroon-800"
          aria-label="Next slide"
          (click)="showNextBanner()"
        >
          <svg
            lucideChevronRight
            [size]="24"
            class="block rtl:hidden"
            aria-hidden="true"
          ></svg>
          <svg
            lucideChevronLeft
            [size]="24"
            class="hidden rtl:block"
            aria-hidden="true"
          ></svg>
        </button>
      </div>
    </div>
  </div>
</section>
