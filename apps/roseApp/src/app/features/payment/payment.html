<section class="px-20 pb-32 pt-16 font-sarabun max-lg:px-8 max-lg:pb-24 max-sm:px-4 max-sm:pb-16 dark:text-white">
  <div class="grid items-start gap-10 lg:grid-cols-[minmax(0,2fr)_minmax(20rem,1fr)]">
    <div class="min-w-0">
      <div class="mb-8 grid grid-cols-[1fr_auto_1fr_auto_1fr] items-center" aria-hidden="true">
        <span class="h-1.5 rounded-full bg-maroon-600"></span>
        <span class="grid size-6 place-items-center rounded-full bg-maroon-600 text-xs font-bold text-white">1</span>
        <span class="h-1.5 rounded-full bg-maroon-600"></span>
        <span class="grid size-6 place-items-center rounded-full bg-maroon-600 text-xs font-bold text-white">2</span>
        <span class="h-1.5 rounded-full bg-zinc-200"></span>
      </div>

      <div class="mb-8 flex items-center gap-5">
        <button
          type="button"
          class="inline-flex h-12 cursor-pointer items-center justify-center gap-2 rounded-xl border-0 bg-zinc-50 px-4 text-lg font-medium text-zinc-900 transition hover:bg-zinc-100 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700"
          (click)="backToAddresses()"
        >
          <svg lucideArrowLeft [size]="20" class="rtl:rotate-180" aria-hidden="true"></svg>
          {{ 'PAYMENT.BACK' | translate }}
        </button>

        <h1 class="m-0 text-4xl font-bold leading-none text-zinc-950 dark:text-white">
          {{ 'PAYMENT.TITLE' | translate }}
        </h1>
      </div>

      <div class="grid gap-6 md:grid-cols-2">
        <button
          type="button"
          class="grid min-h-[18.25rem] cursor-pointer place-items-center rounded-xl border bg-white p-8 text-center transition hover:border-maroon-600 hover:shadow-sm dark:bg-zinc-900"
          [class.border-maroon-600]="selectedMethod() === 'CASH_ON_DELIVERY'"
          [class.border-zinc-300]="selectedMethod() !== 'CASH_ON_DELIVERY'"
          (click)="selectMethod('CASH_ON_DELIVERY')"
        >
          <span class="grid gap-6 justify-items-center">
            <img
              src="/images/cash.webp"
              class="h-32 w-44 object-contain"
              [alt]="'PAYMENT.CASH.TITLE' | translate"
            />
            <span>
              <strong class="block text-3xl font-bold text-zinc-900 dark:text-white">
                {{ 'PAYMENT.CASH.TITLE' | translate }}
              </strong>
              <span class="mt-3 block text-lg leading-tight text-zinc-500 dark:text-zinc-300">
                {{ 'PAYMENT.CASH.DESCRIPTION' | translate }}
              </span>
            </span>
          </span>
        </button>

        <button
          type="button"
          class="grid min-h-[18.25rem] cursor-pointer place-items-center rounded-xl border bg-white p-8 text-center transition hover:border-maroon-600 hover:shadow-sm dark:bg-zinc-900"
          [class.border-maroon-600]="selectedMethod() === 'CREDIT_CARD'"
          [class.border-zinc-300]="selectedMethod() !== 'CREDIT_CARD'"
          (click)="selectMethod('CREDIT_CARD')"
        >
          <span class="grid gap-6 justify-items-center">
            <img
              src="/images/visa.webp"
              class="h-32 w-44 object-contain"
              [alt]="'PAYMENT.CARD.TITLE' | translate"
            />
            <span>
              <strong class="block text-3xl font-bold dark:text-white" [class.text-maroon-600]="selectedMethod() === 'CREDIT_CARD'" [class.text-zinc-900]="selectedMethod() !== 'CREDIT_CARD'">
                {{ 'PAYMENT.CARD.TITLE' | translate }}
              </strong>
              <span class="mt-3 block text-lg leading-tight text-zinc-500 dark:text-zinc-300">
                {{ 'PAYMENT.CARD.DESCRIPTION' | translate }}
              </span>
            </span>
          </span>
        </button>
      </div>

      <div class="mt-9 flex justify-end border-t border-zinc-200 pt-5 dark:border-zinc-700">
        <button
          type="button"
          class="inline-flex h-12 min-w-44 cursor-pointer items-center justify-center gap-2 rounded-[0.625rem] border-0 bg-maroon-600 px-8 text-lg font-bold text-white transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-soft-pink-300 dark:text-zinc-900"
          [disabled]="isLoading()"
          (click)="checkout()"
        >
          {{ 'PAYMENT.CHECKOUT' | translate }}
          <svg lucideArrowRight [size]="18" class="rtl:rotate-180" aria-hidden="true"></svg>
        </button>
      </div>
    </div>

    <aside class="min-w-0 rounded-xl bg-zinc-50 p-6 dark:bg-zinc-900">
      <h2 class="mb-6 text-3xl font-bold leading-none text-zinc-950 dark:text-white">
        {{ 'PAYMENT.SUMMARY.TITLE' | translate }}
      </h2>
      <div class="grid grid-cols-[1fr_auto] gap-2.5 max-sm:grid-cols-1">
        <input
          class="h-12 rounded-[0.625rem] border border-zinc-300 bg-white px-4 text-zinc-900 outline-none transition focus:border-maroon-600 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white"
          [placeholder]="'PAYMENT.SUMMARY.COUPON' | translate"
        />
        <button
          type="button"
          class="inline-flex h-12 cursor-pointer items-center justify-center gap-2 rounded-[0.625rem] border-0 bg-maroon-600 px-5 font-bold text-white transition hover:brightness-95 dark:bg-soft-pink-300 dark:text-zinc-900"
        >
          <svg lucideTicket [size]="18" aria-hidden="true"></svg>
          {{ 'PAYMENT.SUMMARY.APPLY' | translate }}
        </button>
      </div>
      <div class="my-2.5 grid min-h-45 place-items-center rounded-[0.625rem] border border-zinc-300 text-zinc-400 italic dark:border-zinc-700">
        {{ 'PAYMENT.SUMMARY.NO_COUPONS' | translate }}
      </div>
      <div class="mt-3.5 grid grid-cols-[1fr_auto] items-center gap-4 text-lg font-bold">
        <span>{{ 'PAYMENT.SUMMARY.SUBTOTAL' | translate }}</span>
        <strong>{{ subtotal() | number:'1.0-2' }} EGP</strong>
      </div>
      <div class="mt-3.5 grid grid-cols-[1fr_auto] items-center gap-4 border-t border-zinc-300 pt-3.5 text-2xl font-bold text-zinc-950 dark:border-zinc-700 dark:text-white">
        <span>{{ 'PAYMENT.SUMMARY.TOTAL' | translate }}</span>
        <strong>{{ total() | number:'1.0-2' }} EGP</strong>
      </div>
    </aside>
  </div>
</section>
