<section class="mx-auto w-full px-4 py-18 pb-12 md:px-8 lg:px-20">
  <div class="flex items-start gap-8 max-lg:flex-col">

    <app-products-filter
      [activeCategoryId]="activeCategoryId()"
      [activeOccasionId]="activeOccasionId()"
      [(activeRating)]="activeRating"
      (categorySelected)="onCategorySelected($event)"
      (occasionSelected)="onOccasionSelected($event)"
      (ratingSelected)="onRatingSelected($event)"
      (filterCategoryCleared)="onFilterCategoryCleared()"
      (filterOccasionCleared)="onFilterOccasionCleared()"
      (filterRatingCleared)="onFilterRatingCleared()"
      (filterCleared)="onFilterCleared()"
    />

    <!-- Divider -->
    <div
      class="hidden lg:block self-stretch w-px bg-zinc-100 dark:bg-zinc-700">
    </div>

    <!-- Mobile Divider -->
    <hr class="block lg:hidden w-full border-zinc-100 dark:border-zinc-700" />

    <app-products-grid [activeCategoryId]="activeCategoryId()" [activeOccasionId]="activeOccasionId()" [activeRating]="activeRating()" />

  </div>
</section>
