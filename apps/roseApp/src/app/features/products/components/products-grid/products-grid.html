<div class="flex min-w-0 flex-1 flex-col gap-8">
  @if (loading.isLoading()) {
    <p class="py-12 text-center font-sarabun text-zinc-500" aria-busy="true">
      {{ 'PRODUCTS.LOADING' | translate }}
    </p>
  } @else if (!products().length) {
    <p class="py-12 text-center font-sarabun text-zinc-500">
      {{ 'PRODUCTS.EMPTY' | translate }}
    </p>
  } @else {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (product of filteredProducts(); track product.id) {
        <app-ui-card
          [product]="toCardProduct(product)"
          (viewClick)="viewProduct(product)"
          (cartClick)="quickAddToCart(product)"
        />
      }
    </div>
  }

  <hr class="border-zinc-100 dark:border-zinc-700" />

  <nav
    class="flex justify-center pt-1"
    [attr.aria-label]="'PRODUCTS.PAGINATION' | translate"
  >
    <p-paginator
      class="products-paginator"
      [first]="paginatorFirst()"
      [rows]="limit()"
      [totalRecords]="totalRecords()"
      [pageLinkSize]="3"
      [showFirstLastIcon]="true"
      [alwaysShow]="true"
      (onPageChange)="onPageChange($event)"
    />
  </nav>
</div>
