
  <input
    [ngClass]="customClass()"
    [type]="type()"
    [value]="value ?? ''"
    [placeholder]="placeholder()"
    [readOnly]="readonly()"
    [disabled]="disabled"
    [attr.aria-invalid]="isInvalid()"
    (input)="onInputChange($event)"
    (blur)="onInputBlur()"
  />
  @if (helperText() && !isInvalid()) {
    <span class="text-sm text-[#666]">{{ helperText() }}</span>
  }

  @if (isInvalid() && errorMessage()) {
    <span class="mt-1 text-sm font-medium text-[#d93025]">
      {{ errorMessage() }}
    </span>
  }
