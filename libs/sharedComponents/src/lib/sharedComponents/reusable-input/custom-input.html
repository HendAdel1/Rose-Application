<div class="flex w-full flex-col gap-1.5">
  @if (label()) {
    <label class="text-sm font-medium text-[#333]">{{ label() }}</label>
  }

  <input
    class="box-border w-full border border-[#333] border-r-4 px-3 py-2 focus:border-[#007bff] focus:outline-none"
    [type]="type()"
    [value]="value ?? ''"
    [placeholder]="placeholder()"
    [readOnly]="readonly()"
    [disabled]="disabled"
    [attr.aria-invalid]="isInvalid()"
    (input)="onInputChange($event)"
    (blur)="onInputBlur()"
  />

  @if (helperText() && !isInvalid()) {
    <span class="text-sm text-[#666]">{{ helperText() }}</span>
  }

  @if (isInvalid() && errorMessage()) {
    <span class="mt-1 text-sm font-medium text-[#d93025]">
      {{ errorMessage() }}
    </span>
  }
</div>
