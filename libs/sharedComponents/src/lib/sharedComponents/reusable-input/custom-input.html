<div class="flex flex-col  gap-1.5 w-full">
@if(label()){
  <label for="" class="text-[#333] font-medium text-sm">{{label}}</label>
}
<input class="w-full h-[40%] py-2 px-3 border border-[#333] box-border border-r-4 focus:outline-none focus:border-[#007bff]" [type]="type()" [placeholder]="placeholder()" [disabled]="disabled()" (input)="onInputChange($event)"
[attr.aria-invalid]="isIvalid()">
@if(isInvalid()&& errorMessage()){
  <span class="text-[#d93025] text-sm mt-1 font-medium"> {{errorMessage()}} </span>
}
</div>
