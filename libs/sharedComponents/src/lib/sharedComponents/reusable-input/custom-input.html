<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <label class="text-[#333] font-medium text-sm">{{ label() }}</label>
  }

  <input
    class="w-full py-2 px-3 border border-[#333] box-border border-r-4 focus:outline-none focus:border-[#007bff]"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [readOnly]="readonly()"
    [value]="value ?? ''"
    [attr.aria-invalid]="isInvalid()"
    (blur)="onInputBlur()"
    (input)="onInputChange($event)"
  />

  @if (isInvalid() && errorMessage()) {
    <span class="text-[#d93025] text-sm mt-1 font-medium">{{ errorMessage() }}</span>
  }
</div>
