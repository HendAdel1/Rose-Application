@if (show()) {
      <ngx-spinner
        [bdColor]="bdColor()"
        [size]="size()"
        [color]="color()"
        [type]="type()"
        [fullScreen]="fullScreen()"
      >
        @if (loadingText()) {
          <p class="text-white text-sm mt-2 font-medium">{{ loadingText() }}</p>
        }
      </ngx-spinner>
    }
